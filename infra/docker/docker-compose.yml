services:
  redis:
    image: redis:7-alpine
    container_name: swahit-redis-local
    restart: always
    command: redis-server --requirepass swahit_redis_pass
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
